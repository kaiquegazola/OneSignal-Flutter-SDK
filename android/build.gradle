group 'com.onesignal.flutter'
version '5.7.0'

def safeEnvFlagGet(prop) {
    def value = System.getenv(prop)
    def normalizedValue = value?.toString()?.trim()
    return normalizedValue != null && (normalizedValue.equalsIgnoreCase('true') || normalizedValue == '1')
}

def oneSignalVersion = '5.10.2'
// Fork: native SDK with the auto-init gate, built by JitPack from
// github.com/kaiquegazola/OneSignal-Android-SDK. Every com.onesignal module the fork
// ships is substituted (direct and transitive) so the upstream copy is never resolved.
def oneSignalForkVersion = '5.10.2-noautoinit.4'
def oneSignalForkGroup = 'com.github.kaiquegazola.OneSignal-Android-SDK'
def oneSignalForkModules = ['OneSignal', 'core', 'notifications', 'in-app-messages', 'location']
def oneSignalDisableLocation = safeEnvFlagGet('ONESIGNAL_DISABLE_LOCATION')

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content { includeGroup oneSignalForkGroup }
        }
    }
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            oneSignalForkModules.each { name ->
                substitute(module("com.onesignal:${name}"))
                    .using(module("${oneSignalForkGroup}:${name}:${oneSignalForkVersion}"))
            }
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    // Condition for namespace compatibility in AGP <4.2
    if (project.android.hasProperty("namespace")) {
        namespace 'com.onesignal.flutter'
    }

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    if (oneSignalDisableLocation) {
        implementation "com.onesignal:core:${oneSignalVersion}"
        implementation "com.onesignal:notifications:${oneSignalVersion}"
        implementation "com.onesignal:in-app-messages:${oneSignalVersion}"
    } else {
        implementation "com.onesignal:OneSignal:${oneSignalVersion}"
    }
}
